# Reusable workflow for scanning dependencies from product repos
# This workflow is meant to be called from product repos (membresias-web, membresias-backoffice)

name: Radar Scan

on:
  workflow_call:
    inputs:
      product-name:
        required: true
        type: string
        description: 'Name of the product (e.g., membresias-web)'
    secrets:
      RADAR_DATA_PUSH_TOKEN:
        required: true
        description: 'Token with push access to radar-data repo'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout product repo
        uses: actions/checkout@v4

      - name: Checkout radar-ingestor
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/tech-radar
          path: radar-ingestor
          token: ${{ secrets.RADAR_DATA_PUSH_TOKEN }}

      - name: Checkout radar-data
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/radar-data
          path: radar-data
          token: ${{ secrets.RADAR_DATA_PUSH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: radar-ingestor/package-lock.json

      - name: Install ingestor dependencies
        run: cd radar-ingestor && npm ci

      - name: Run dependency scan
        run: |
          cd radar-ingestor
          npx tsx scripts/ingest/scanDependencies.ts \
            ../package.json \
            ${{ inputs.product-name }} \
            ${{ inputs.product-name }} \
            ../radar-data

      - name: Commit and push radar data
        run: |
          cd radar-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update ${{ inputs.product-name }} radar data"
          git push
